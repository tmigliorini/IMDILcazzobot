      creditor: "<i>(<b>%{ghei} ghei</b> puri, +<b>%{delta}</b> de credit)</i>"
      debtor: "<i>(<b>%{ghei} ghei</b> puri, -<b>%{delta}</b> de debit)</i>"
    ending: "<i>[+] el voeur dì che chi gioega no gh'a minga ancamò fada cresce el sò bigol incoeu.</i>"
    empty: "Gh'è ancamò nissun in del gioeugh :("
  dod:
    description: "Elegg ul Bigol del Dì"
