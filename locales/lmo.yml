      start: "💰 Ul <b>%{name}</b> el voeur donà <b>%{amount} ghei</b> a quaivun!"
      start_targeted: "💰 <b>%{name}</b> el voeur donà <b>%{amount} ghei</b> a <b>%{target_name}</b>!"
      request: "💰 Ul <b>%{name}</b> el ciama <b>%{amount} ghei</b> de quaivun!"
      request_targeted: "💰 <b>%{name}</b> el ciama <b>%{amount} ghei</b> a <b>%{target_name}</b>!"
      finish: "💰 Ul <b>%{donor_name}</b> el gh'ha donaa <b>%{amount} ghei</b> a <b>%{receiver_name}</b>! Adess el donador l'è longh <b>%{donor_length} ghei</b> e el ricevidor <b>%{receiver_length} ghei</b>."
      position:
        donor: "La posizion de ul <b>%{name}</b> in la classifica l'è <b>%{pos}</b>."
        receiver: "La posizion de ul <b>%{name}</b> in la classifica l'è <b>%{pos}</b>."
    button: "Ricevi!"
    button_pull: "Donagh!"
    errors:
      no_args: "Ciama el comand cont el numer de ghei che te voeuret donà."
      not_enough: "Te gh'hee minga assee ghei per donagh tucc quj!"
      same_person: "Te poeudet minga donà ghei a te midemm!"
      not_target: "Sta donazion chì l'è minga per tì!"
      target_not_found: "Gh'è nissun giugadôr ciamaa '%{name}'."
      target_ambiguous: "Gh'è pussee de on giugadôr ciamaa '%{name}': fa la domanda pussee precisa."
      already_in_progress: "La donazion l'è giamò in cors! El messagg el sarà agiornaa in d'on moment…"
  tax:
    description: "Tassa i pussee gross e dona ai pussee minga gross"
