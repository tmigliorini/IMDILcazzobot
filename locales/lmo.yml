      start: "🎰 Ul <b>%{name}</b> l'ha sfidaa la chat cont una posta de <b>%{bet} ghei</b>!"
      start_targeted: "🎰 <b>%{name}</b> l'ha sfidaa <b>%{target_name}</b> cont una posta de <b>%{bet} ghei</b>!"
      finish: "🎰 El vincidor l'è ul <b>%{winner_name}</b> (gh'aveva el <b>%{winner_probability}</b> de probabilità de vince)! El sò bigol l'è adess longh <b>%{winner_length} ghei</b>. Quell del perdent l'è <b>%{loser_length}</b>.\nLa posta l'era <b>%{bet} ghei</b>."
      position:
        winner: "La posizion de <b>%{name}</b> in la classifica l'è <b>%{pos}</b>."
        loser: "La posizion de ul <b>%{name}</b> in la classifica l'è <b>%{pos}</b>."
      stats:
        text: "Percentual de vittorie del <b>vincidor</b> — <b>%{winner_win_rate}</b>.\nLa soa striscia de vittorie attuala — <b>%{winner_win_streak}</b>, striscia massima — <b>%{winner_win_streak_max}</b>.\nPercentual de vittorie del <b>perdent</b> — <b>%{loser_win_rate}</b>."
        lost_win_streak: "L'è andada perduda la striscia de <b>%{lost_win_streak}</b> vittorie de fila."
        lose_streak_current: "El perdent l'ha perduu <b>%{lose_streak}</b> sfide de fila."
        snapped_lose_streak: "El vincidor l'ha just interrott una striscia de <b>%{snapped_lose_streak}</b> sconfitte de fila."
