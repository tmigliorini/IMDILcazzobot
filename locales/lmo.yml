    position: "La soa posizion in la classifica l'è <b>%{pos}</b>."
    already_chosen: "🍆 Ul Bigol del Dì l'è giamò staa scernii per incoeu! L'è <b>%{name}</b>."
    unknown_winner: "quaivun"
    no_candidates: "🍆 Gh'è nissun candidaa per l'elezion. In sta chat chì gh'è ancamò nissun in del gioeugh 😢"
  pvp:
    description: "Combatt cont el bigol del tò amis!"
