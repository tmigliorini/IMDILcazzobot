    button: "Ataca!"
    errors:
      no_args: "Ciama el comand cont el numer de ghei che te voeuret mett in posta."
      not_enough:
        initiator: "Meh. El bigol de chi ha sfidaa l'è no assee longh per una posta inscì grossa!"
        acceptor: "El tò sciopp l'è no assee long 😣"
      same_person: "Te poeudet no combatt cont te midemm!"
      not_target: "Sta sfida chì l'è minga per tì!"
      invalid_probability: "La probabilità '%{probability}%' l'è minga valida: dovaria vess tra 0% e 100% (esclüs)."
      target_not_found: "Gh'è nissun giugadôr ciamaa '%{name}'."
      target_ambiguous: "Gh'è pussee de on giugadôr ciamaa '%{name}': fa la domanda pussee precisa."
      battle_already_in_progress: "La sfida l'è giamò in cors! El messagg el sarà agiornaa in d'on moment…"
  donate:
    description: "Dona di ghei a chi te voeuret!"
